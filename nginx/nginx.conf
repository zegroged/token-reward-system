# ── RATE LIMITING ──
map $http_x_forwarded_for $limit_key {
    default $binary_remote_addr;
    "~."    $http_x_forwarded_for;
}
limit_req_zone $limit_key zone=login:10m rate=5r/m;
limit_req_zone $limit_key zone=api:10m rate=30r/s;
limit_req_zone $limit_key zone=general:10m rate=10r/s;

server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name _;

    # SSL — Let's Encrypt (development'ta self-signed kullanılabilir)
    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # ── GÜVENLİK HEADER'LARI ──
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://www.google.com https://www.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; frame-src https://www.google.com; img-src 'self' data: https:; connect-src 'self' https://api.coingecko.com;" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # ★ FIX #16: CF header spoofing koruması
    # Cloudflare arkasında DEĞİLSENİZ: client gönderdiği cf-connecting-ip header'ı
    # Nginx tarafından silinir → uygulama gerçek IP'yi x-real-ip'den alır
    # Cloudflare arkasındaysanız bu bloğu kaldırın.
    proxy_set_header cf-connecting-ip "";

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 1000;

    # Body size limit
    client_max_body_size 5m;

    # ── PROXY → Next.js ──
    location / {
        proxy_pass http://web:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        limit_req zone=general burst=20 nodelay;
    }

    # Login endpoint — sıkı rate limit
    location /api/auth/ {
        proxy_pass http://web:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        limit_req zone=login burst=3 nodelay;
    }

    # API endpoints
    location /api/ {
        proxy_pass http://web:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        limit_req zone=api burst=50 nodelay;
    }

    # Static assets — cache
    location /_next/static/ {
        proxy_pass http://web:3000;
        expires 365d;
        add_header Cache-Control "public, immutable";
    }

    # Health check
    location /health {
        proxy_pass http://web:3000;
        access_log off;
    }
}
